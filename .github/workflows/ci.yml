name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy backend
      - run: pytest backend/tests -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: debug_logs
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d debug_logs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      INTEGRATION: "1"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: debug_logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest backend/tests/test_integration.py -q

  openapi-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: regenerate openapi.json and assert no diff
        run: |
          python scripts/dump_openapi.py > /tmp/openapi.new.json
          diff -u openapi.json /tmp/openapi.new.json

  image-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: build runtime image
        run: docker build -f docker/Dockerfile -t debug-assistant:ci .
      - name: trivy scan (HIGH/CRITICAL only, fails on findings)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: debug-assistant:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
