version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      runtime:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "pydantic*"
          - "sqlalchemy"
          - "asyncpg"
          - "alembic"
          - "openai"
          - "kafka-python"
          - "psycopg2-binary"
          - "redis"
          - "prometheus-client"
          - "opentelemetry-*"
      dev:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "fakeredis"
          - "httpx"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
