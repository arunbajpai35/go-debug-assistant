site_name: debug-assistant
site_description: log triage backend with kafka ingestion, sliding-window correlation, and llm-assisted root-cause labeling
repo_url: https://github.com/arunbajpai35/go-debug-assistant
repo_name: arunbajpai35/go-debug-assistant
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - API: api.md
  - Operations: operations.md
  - Eval: eval.md
