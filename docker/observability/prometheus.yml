global:
  scrape_interval: 10s

scrape_configs:
  - job_name: debug-assistant-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus-self
    static_configs:
      - targets: ["localhost:9090"]
